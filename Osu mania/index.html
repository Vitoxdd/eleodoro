<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu!mania Web Edition</title>
    <!-- Tailwind CSS for modern responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #09090e;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        /* Custom Glowing & Glassmorphism effects */
        .neon-glow-pink {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.4);
        }
        .neon-glow-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4);
        }
        .glass-panel {
            background: rgba(18, 18, 28, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        /* Lane hit animations */
        @keyframes flashEffect {
            0% { opacity: 0.8; transform: scaleY(1); }
            100% { opacity: 0; transform: scaleY(0.9); }
        }
        .hit-flash {
            animation: flashEffect 0.12s ease-out forwards;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 15, 25, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- Background Animated Grid Stars -->
    <div class="absolute inset-0 z-0 pointer-events-none opacity-30 bg-[radial-gradient(#ec4899_1px,transparent_1px)] [background-size:24px_24px]"></div>

    <!-- MAIN MENU SCREEN -->
    <div id="main-menu" class="z-10 w-full max-w-4xl p-6 flex flex-col items-center justify-center space-y-8 animate-fade-in">
        <div class="text-center">
            <h1 class="text-5xl md:text-7xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 neon-glow-pink">
                osu!mania
            </h1>
            <p class="text-gray-400 text-lg mt-2 font-medium tracking-widest uppercase">Edição Web HTML5 / JavaScript</p>
        </div>

        <!-- Song Selector Section -->
        <div class="w-full glass-panel rounded-2xl p-6 border border-pink-500/20">
            <h2 class="text-xl font-bold font-orbitron text-pink-400 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-2v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-2"></path></svg>
                SELECIONE A MÚSICA
            </h2>
            
            <div id="song-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-64 overflow-y-auto pr-2">
                <!-- Dynamic song cards will be injected here -->
            </div>
        </div>

        <!-- Settings Options -->
        <div class="w-full glass-panel rounded-2xl p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Velocidade das Notas: <span id="speed-val" class="text-pink-400 font-bold">2.2x</span></label>
                <input type="range" id="speed-slider" min="1.0" max="4.0" step="0.2" value="2.2" class="w-full accent-pink-500 cursor-pointer">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Teclas (4K):</label>
                <div class="flex gap-2">
                    <span class="px-3 py-1 bg-pink-950/60 border border-pink-500/40 rounded font-orbitron font-bold text-pink-300 text-sm">D</span>
                    <span class="px-3 py-1 bg-cyan-950/60 border border-cyan-500/40 rounded font-orbitron font-bold text-cyan-300 text-sm">F</span>
                    <span class="px-3 py-1 bg-cyan-950/60 border border-cyan-500/40 rounded font-orbitron font-bold text-cyan-300 text-sm">J</span>
                    <span class="px-3 py-1 bg-pink-950/60 border border-pink-500/40 rounded font-orbitron font-bold text-pink-300 text-sm">K</span>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Volume do Efeito:</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.7" class="w-full accent-cyan-400 cursor-pointer">
            </div>
        </div>

        <!-- Play Button -->
        <button id="start-btn" class="w-full md:w-80 py-4 bg-gradient-to-r from-pink-600 via-purple-600 to-cyan-600 hover:from-pink-500 hover:to-cyan-500 text-white font-black font-orbitron text-2xl rounded-xl shadow-lg hover:shadow-pink-500/30 transition transform hover:-translate-y-1 active:translate-y-0">
            INICIAR JOGO
        </button>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="game-screen" class="hidden z-10 w-full h-full flex flex-col items-center justify-between p-2 md:p-4">
        <!-- Top HUD -->
        <div class="w-full max-w-xl glass-panel rounded-xl p-3 flex justify-between items-center z-20 border-b border-pink-500/30">
            <div class="flex flex-col">
                <span id="game-song-title" class="text-xs font-bold text-gray-400 truncate max-w-[150px]">Música</span>
                <span id="game-score" class="text-2xl font-black font-orbitron text-pink-400">0000000</span>
            </div>
            <!-- Accuracy & Combo -->
            <div class="text-center">
                <div id="game-accuracy" class="text-xl font-bold font-orbitron text-cyan-400">100.00%</div>
                <div class="text-xs text-gray-400">PRECISÃO</div>
            </div>
            <!-- Life Health Bar -->
            <div class="w-28 md:w-36">
                <div class="flex justify-between text-xs font-bold mb-1">
                    <span class="text-gray-300">HP</span>
                    <span id="hp-val" class="text-emerald-400">100%</span>
                </div>
                <div class="w-full bg-gray-800 h-3 rounded-full overflow-hidden border border-gray-700">
                    <div id="hp-bar" class="bg-gradient-to-r from-pink-500 to-emerald-400 h-full transition-all duration-75 w-full"></div>
                </div>
            </div>
        </div>

        <!-- Game Playfield Area -->
        <div id="playfield-container" class="relative flex-1 w-full max-w-md my-2 flex justify-center items-center overflow-hidden rounded-xl border border-gray-800 bg-black/80 shadow-2xl">
            <!-- Canvas where notes fall -->
            <canvas id="game-canvas" class="w-full h-full block"></canvas>

            <!-- Judgment Popup Effect -->
            <div id="judgment-popup" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none opacity-0 transition-all duration-100">
                <div id="judgment-text" class="text-3xl md:text-4xl font-black font-orbitron tracking-widest drop-shadow-md">PERFECT</div>
                <div id="combo-text" class="text-xl font-bold text-white font-orbitron mt-1">12x</div>
            </div>
        </div>

        <!-- Touch Controls for Mobile Devices -->
        <div class="w-full max-w-md grid grid-cols-4 gap-2 md:hidden z-20 pb-2">
            <button class="touch-btn py-5 bg-pink-900/40 border border-pink-500/50 rounded-lg text-pink-300 font-bold text-xl active:bg-pink-600" data-key="0">D</button>
            <button class="touch-btn py-5 bg-cyan-900/40 border border-cyan-500/50 rounded-lg text-cyan-300 font-bold text-xl active:bg-cyan-600" data-key="1">F</button>
            <button class="touch-btn py-5 bg-cyan-900/40 border border-cyan-500/50 rounded-lg text-cyan-300 font-bold text-xl active:bg-cyan-600" data-key="2">J</button>
            <button class="touch-btn py-5 bg-pink-900/40 border border-pink-500/50 rounded-lg text-pink-300 font-bold text-xl active:bg-pink-600" data-key="3">K</button>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="results-screen" class="hidden z-20 w-full max-w-lg p-6 glass-panel rounded-2xl border border-pink-500/30 flex flex-col items-center space-y-6">
        <h2 class="text-3xl font-black font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-cyan-400">
            RESULTADO FINAL
        </h2>

        <div class="flex items-center justify-around w-full my-2">
            <!-- Rank Grade Badge -->
            <div id="rank-badge" class="w-24 h-24 rounded-2xl bg-gradient-to-br from-yellow-400 to-amber-600 flex items-center justify-center text-6xl font-black font-orbitron shadow-lg text-black">
                S
            </div>
            <div class="flex flex-col space-y-1 text-right font-orbitron">
                <span class="text-xs text-gray-400">PONTUAÇÃO TOTAL</span>
                <span id="res-score" class="text-3xl font-bold text-pink-400">0950000</span>
                <span class="text-xs text-gray-400 mt-2">PRECISÃO</span>
                <span id="res-acc" class="text-xl font-bold text-cyan-400">98.50%</span>
            </div>
        </div>

        <!-- Breakdown Stats -->
        <div class="w-full bg-black/50 rounded-xl p-4 grid grid-cols-2 gap-3 text-sm font-semibold">
            <div class="flex justify-between border-b border-gray-800 pb-1"><span class="text-cyan-300">MARVELOUS:</span><span id="cnt-marvelous">0</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1"><span class="text-yellow-300">PERFECT:</span><span id="cnt-perfect">0</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1"><span class="text-green-300">GREAT:</span><span id="cnt-great">0</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1"><span class="text-purple-300">GOOD:</span><span id="cnt-good">0</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1"><span class="text-orange-300">BAD:</span><span id="cnt-bad">0</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1"><span class="text-red-400">MISS:</span><span id="cnt-miss">0</span></div>
        </div>

        <div class="w-full flex justify-between font-orbitron text-sm">
            <span class="text-gray-400">MÁXIMO COMBO:</span>
            <span id="res-maxcombo" class="text-pink-400 font-bold">245x</span>
        </div>

        <div class="flex gap-4 w-full">
            <button id="retry-btn" class="flex-1 py-3 bg-pink-600 hover:bg-pink-500 rounded-xl font-orbitron font-bold text-white transition">
                JOGAR NOVAMENTE
            </button>
            <button id="menu-btn" class="flex-1 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl font-orbitron font-bold text-gray-200 transition">
                MENU INICIAL
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT GAME ENGINE -->
    <script>
        // Web Audio Context initialization
        let audioCtx = null;
        
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Sound synthesizer for key taps and hits
        function playHitSound(freq = 600, type = 'sine', duration = 0.05) {
            try {
                const ctx = getAudioContext();
                const volSlider = parseFloat(document.getElementById('volume-slider').value);
                if (volSlider <= 0) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                
                gain.gain.setValueAtTime(volSlider * 0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                console.warn("Audio error", e);
            }
        }

        // Synthesizes EDM songs dynamically synchronized with beatmaps
        class AudioTrackSynth {
            constructor(bpm, pattern) {
                this.bpm = bpm;
                this.pattern = pattern;
                this.isPlaying = false;
                this.startTime = 0;
                this.scheduledNodes = [];
            }

            start() {
                const ctx = getAudioContext();
                this.stop();
                this.isPlaying = true;
                this.startTime = ctx.currentTime;
                
                const beatDuration = 60 / this.bpm;
                const totalBeats = this.pattern.length;

                // Loop playback setup
                for (let loop = 0; loop < 4; loop++) {
                    this.pattern.forEach((note, index) => {
                        if (note < 0) return; // Rest
                        const time = this.startTime + (loop * totalBeats + index) * (beatDuration / 2);
                        
                        // Synth lead
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const freqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
                        const noteFreq = freqs[note % freqs.length] * (note > 3 ? 1.5 : 1);

                        osc.type = (index % 2 === 0) ? 'sawtooth' : 'square';
                        osc.frequency.setValueAtTime(noteFreq, time);

                        gain.gain.setValueAtTime(0.12, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + (beatDuration / 2) * 0.8);

                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        osc.start(time);
                        osc.stop(time + beatDuration / 2);
                        this.scheduledNodes.push(osc);

                        // Drum beat pulse
                        if (index % 2 === 0) {
                            const kick = ctx.createOscillator();
                            const kickGain = ctx.createGain();
                            kick.frequency.setValueAtTime(130, time);
                            kick.frequency.exponentialRampToValueAtTime(30, time + 0.1);
                            kickGain.gain.setValueAtTime(0.25, time);
                            kickGain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                            kick.connect(kickGain);
                            kickGain.connect(ctx.destination);
                            kick.start(time);
                            kick.stop(time + 0.1);
                            this.scheduledNodes.push(kick);
                        }
                    });
                }
            }

            stop() {
                this.isPlaying = false;
                this.scheduledNodes.forEach(node => {
                    try { node.stop(); } catch(e){}
                });
                this.scheduledNodes = [];
            }
        }

        // Songs & Beatmaps Database
        const SONGS_CATALOG = [
            {
                id: 'cyber_pulse',
                title: 'Cyber Pulse',
                artist: 'SynthWave LAB',
                bpm: 130,
                difficulty: 'FÁCIL',
                color: 'from-cyan-500 to-blue-600',
                pattern: [0, -1, 1, -1, 2, -1, 3, -1, 2, 1, 0, -1, 3, 2, 1, 0],
                notesCount: 85
            },
            {
                id: 'neon_overdrive',
                title: 'Neon Overdrive',
                artist: 'ElectroBeat Pro',
                bpm: 155,
                difficulty: 'MÉDIO',
                color: 'from-pink-500 to-purple-600',
                pattern: [0, 1, 2, 3, 1, 2, 0, 3, 2, 1, 3, 0, 2, 3, 1, 0],
                notesCount: 140
            },
            {
                id: 'speed_demon',
                title: 'Speed Demon',
                artist: 'HyperDrive X',
                bpm: 185,
                difficulty: 'DIFÍCIL',
                color: 'from-red-500 to-amber-500',
                pattern: [0, 3, 1, 2, 0, 3, 2, 1, 3, 0, 1, 3, 2, 0, 3, 1, 2, 3, 0, 1],
                notesCount: 220
            }
        ];

        let selectedSong = SONGS_CATALOG[0];
        let currentAudioSynth = null;

        // Render Song Selection List
        function renderSongList() {
            const container = document.getElementById('song-list');
            container.innerHTML = '';

            SONGS_CATALOG.forEach(song => {
                const card = document.createElement('div');
                const isSelected = song.id === selectedSong.id;
                card.className = `p-4 rounded-xl border cursor-pointer transition flex justify-between items-center ${
                    isSelected 
                    ? 'bg-gradient-to-r ' + song.color + ' border-white text-white shadow-lg' 
                    : 'bg-gray-900/60 border-gray-800 text-gray-300 hover:border-gray-600'
                }`;

                card.innerHTML = `
                    <div>
                        <div class="font-bold font-orbitron text-lg">${song.title}</div>
                        <div class="text-xs opacity-80">${song.artist} • ${song.bpm} BPM</div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold px-2 py-1 rounded bg-black/40 border border-white/20">${song.difficulty}</span>
                    </div>
                `;

                card.onclick = () => {
                    selectedSong = song;
                    renderSongList();
                    playHitSound(800, 'triangle', 0.08);
                };
                container.appendChild(card);
            });
        }

        // Game State Variables
        let scrollSpeed = 2.2;
        let isPlaying = false;
        let animationFrameId = null;
        let notes = [];
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let hp = 100;
        let totalNotesCount = 0;
        let hitsCount = { marvelous: 0, perfect: 0, great: 0, good: 0, bad: 0, miss: 0 };

        const keyState = [false, false, false, false];
        const keyBinds = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'];
        const laneColors = ['#ec4899', '#06b6d4', '#06b6d4', '#ec4899']; // Pink, Cyan, Cyan, Pink

        // Canvas element setup
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        window.addEventListener('resize', resizeCanvas);

        // Keyboard Listener
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const keyIndex = keyBinds.indexOf(e.code);
            if (keyIndex !== -1) {
                keyState[keyIndex] = true;
                if (isPlaying) {
                    processKeyPress(keyIndex);
                    playHitSound(500 + keyIndex * 100, 'sine', 0.04);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const keyIndex = keyBinds.indexOf(e.code);
            if (keyIndex !== -1) {
                keyState[keyIndex] = false;
            }
        });

        // Touch Control Listeners
        document.querySelectorAll('.touch-btn').forEach(btn => {
            const keyIdx = parseInt(btn.getAttribute('data-key'));
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keyState[keyIdx]
